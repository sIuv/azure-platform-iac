# Samlar manifesten och lägger allt i namespacet hello-app.
#
# Deploy: kubectl apply -k app/k8s
#
# Pipelinen sätter rätt image innan deploy med:
#   kustomize edit set image hello-app=ghcr.io/<ägare>/<repo>/hello-app:<commit>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-app

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
