# Testar och bygger appen i app/ varje gång något i app/ ändras.
#
# - Pull request: kör testerna och bygger imagen, men pushar ingenting.
# - Push till main: kör testerna, bygger och pushar imagen till ghcr.io.
# - Manuellt (Run workflow): samma som push till main. Används om imagen
#   saknas, till exempel första gången.
#
# Trivy kontrollerar Containerfile och app/k8s/ före bygget, och den färdiga
# imagen efter bygget men före push. Hittar den något allvarligt stoppas
# workflowen, och ingenting pushas.
#
# Terraform Infra bygger inte appen själv, utan deployar imagen härifrån.
# Imagens tagg är id:t för senaste commit som ändrade app/, se
# .github/actions/app-image/action.yaml.
#
# Nya paket på ghcr.io blir alltid privata. Efter första pushen måste paketet
# göras publikt en gång (Packages → hello-app → Package settings → Change
# visibility → Public), annars får AKS inte hämta imagen.

name: App Build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-build.yaml"
      - ".github/actions/app-image/**"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-build.yaml"
      - ".github/actions/app-image/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Samma version som i terraform-validate.yaml. Dependabot uppdaterar inte
  # den, så höj den för hand. Trivy v0.69.4–v0.69.6 var skadliga, så
  # kontrollera Trivys säkerhetsmeddelanden innan du byter version.
  TRIVY_VERSION: v0.76.2

jobs:
  app:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # för att få pusha imagen till ghcr.io
    defaults:
      run:
        working-directory: ./app

    steps:
      # Hela historiken behövs för att hitta senaste ändringen i app/.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # setup-uv har ingen tagg för bara huvudversionen (v10), därför exakt version.
      # Python-versionen läses från app/.python-version och hämtas av uv själv.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0

      # --locked: misslyckas om uv.lock inte stämmer med pyproject.toml.
      - name: App Test
        run: uv run --locked pytest

      # Letar efter osäkra inställningar i Containerfile och app/k8s/, till
      # exempel en container som körs som root. Samma regler för stopp och
      # undantag som i Terraform Validate.
      - name: Trivy Config Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: app
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

      - name: App Image
        id: image
        uses: ./.github/actions/app-image

      # Byggs med buildah, som är byggt kring OCI-standarden, i stället för
      # Docker. --format oci ger en ren OCI-image (inte Dockers eget format).
      #
      # Labeln kopplar paketet på ghcr.io till det här repot. Utan den skapas
      # paketet utan koppling, och då nekas workflowens token att skriva till
      # det (pushen misslyckas med "denied" på sista steget).
      - name: App Build
        run: >
          buildah build
          --format oci
          --file Containerfile
          --tag "${{ steps.image.outputs.name }}"
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          .

      # Trivy läser imagen från en fil, eftersom den inte är pushad än och
      # buildah inte har någon Docker-daemon som Trivy kan fråga.
      - name: App Image Export
        run: buildah push "${{ steps.image.outputs.name }}" "oci-archive:${{ runner.temp }}/hello-app.tar"

      # Letar efter kända sårbarheter i imagen innan den pushas, så att en
      # sårbar image aldrig hamnar på ghcr.io. ignore-unfixed: sårbarheter som
      # ännu saknar rättelse går inte att åtgärda, och skulle annars stoppa
      # varje bygge tills Debian eller Python har släppt en rättelse.
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/hello-app.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}
          # Trivy installerades redan av steget Trivy Config Scan.
          skip-setup-trivy: true

      # Pull requests pushar inte, så att bara kod som finns på main hamnar
      # i registryt.
      - name: Login To GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: App Push
        if: github.event_name != 'pull_request'
        run: buildah push "${{ steps.image.outputs.name }}"
