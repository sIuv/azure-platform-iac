# Bygger eller river terraform/infra/ (AKS-klustret) manuellt från fliken Actions.
# Vid "apply" deployas även appen i app/ till klustret och testas.
#
# Tänkt för labb: vid "apply" kan allt rivas automatiskt efter en timer, så att
# det inte står kvar och kostar pengar om man glömmer bort det.
#
# Appen byggs inte här, utan av workflowen App Build varje gång app/ ändras.
# Här deployas den image som App Build redan har pushat.
#
# Ordning vid apply:
#
#   check-image ─► terraform-apply ─► app-deploy ─► auto-destroy (väntar, river sedan)
#
# Förutsättningar i Azure (skapas inte av den här workflowen):
#   - En identitet med en federated credential som litar på det här repot
#     (OIDC, så att inga lösenord lagras i GitHub).
#   - Identiteten har rollen Contributor på subscriptionen och rollen
#     Storage Blob Data Contributor på lagringskontot för state.
#
# Förutsättningar i GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   Variables: TFSTATE_STORAGE_ACCOUNT (namnet som bootstrap skriver ut)
#
# Appens image hamnar i GitHub Container Registry (ghcr.io). Paketet måste
# vara publikt, annars får AKS inte hämta det.

name: Terraform Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Vad ska göras?"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
      auto_destroy_minutes:
        description: "Minuter innan automatisk destroy (0 = ingen timer)"
        required: true
        default: "15"
        type: choice
        options:
          - "15"
          - "30"
          - "60"
          - "0"

permissions:
  id-token: write # krävs för att GitHub ska kunna utfärda en OIDC-token till Azure
  contents: read

# Två körningar samtidigt mot samma state skulle krocka på state-låset.
# Den nya körningen får vänta i stället för att avbryta en pågående destroy.
concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  # azurerm-providern läser de här direkt och loggar in via OIDC.
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  # Variabeln subscription_id i terraform/infra/variables.tf saknar default.
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TERRAFORM_DIR: ./terraform/infra

jobs:
  # Kontrollerar att appens image finns och går att hämta utan inloggning,
  # innan AKS skapas. Annars skulle klustret byggas i onödan och deployen
  # misslyckas först efter 10–15 minuter.
  check-image:
    if: inputs.action == 'apply'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      # Hela historiken behövs för att hitta senaste ändringen i app/.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: App Image
        id: image
        uses: ./.github/actions/app-image

      # skopeo läser imagen direkt från registryt utan att hämta den.
      # Ingen inloggning, med flit: det är så AKS hämtar imagen, så går det
      # här går det även där. "docker://" är namnet på registry-protokollet,
      # det betyder inte att Docker används.
      - name: Check Image Is Pullable
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if skopeo inspect --raw "docker://$IMAGE" > /dev/null; then
            echo "OK: $IMAGE finns och är publik."
            exit 0
          fi
          echo "FEL: $IMAGE går inte att hämta utan inloggning." >&2
          echo "Antingen är den inte byggd (kör App Build) eller så är paketet" >&2
          echo "privat (Packages → hello-app → Package settings → Change visibility → Public)." >&2
          exit 1

  terraform-apply:
    needs: check-image
    if: inputs.action == 'apply'
    runs-on: ubuntu-26.04
    # Att skapa AKS tar ofta 10–15 minuter.
    timeout-minutes: 30
    outputs:
      resource-group: ${{ steps.outputs.outputs.resource-group }}
      aks-name: ${{ steps.outputs.outputs.aks-name }}
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: ${{ env.TERRAFORM_DIR }}
          storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Applicerar exakt den plan som skrevs ut i steget ovan.
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # Sparar klustrets namn så att app-deploy vet vart den ska deploya.
      - name: Terraform Output
        id: outputs
        run: |
          terraform output
          echo "resource-group=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "aks-name=$(terraform output -raw aks_name)" >> "$GITHUB_OUTPUT"

  app-deploy:
    needs: [check-image, terraform-apply]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./app/k8s

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AKS Credentials
        run: >
          az aks get-credentials
          --resource-group "${{ needs.terraform-apply.outputs.resource-group }}"
          --name "${{ needs.terraform-apply.outputs.aks-name }}"

      # Namespacet skapas först, eftersom de andra filerna lägger sig i det.
      # sed byter ut ${IMAGE} i deployment.yaml mot imagen som check-image
      # kontrollerade. sed i stället för envsubst, eftersom sed garanterat
      # finns på runnern.
      - name: App Deploy
        env:
          IMAGE: ${{ needs.check-image.outputs.image }}
        run: |
          kubectl apply -f namespace.yaml
          kubectl apply -f service.yaml
          sed "s|\${IMAGE}|$IMAGE|" deployment.yaml | kubectl apply -f -

      # Väntar tills alla poddar är uppe, så att testet inte körs för tidigt.
      - name: Wait For Rollout
        run: kubectl rollout status deployment/hello-app --namespace hello-app --timeout=5m

      - name: App Smoke Test
        run: ./smoke-test.sh

  auto-destroy:
    needs: [terraform-apply, app-deploy]
    # always() gör att jobbet körs även om något jobb före misslyckades eller
    # om körningen avbröts. Annars kan resurser bli kvar och kosta.
    # Hoppades terraform-apply över (check-image misslyckades) skapades inget,
    # och då finns inget att riva.
    if: >-
      always()
      && inputs.action == 'apply'
      && inputs.auto_destroy_minutes != '0'
      && needs.terraform-apply.result != 'skipped'
    runs-on: ubuntu-26.04
    # Marginal över den längsta timern (60 min) plus tid för destroy.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: ${{ env.TERRAFORM_DIR }}
          storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}

      # Väntar bara om allt gick bra. Gick något fel finns inget att använda,
      # och då rivs allt direkt.
      - name: Wait Before Auto Destroy
        if: needs.app-deploy.result == 'success'
        env:
          WAIT_MINUTES: ${{ inputs.auto_destroy_minutes }}
        run: |
          echo "Klustret och appen är uppe. Allt rivs automatiskt om $WAIT_MINUTES minuter."
          echo "Avbryt körningen i Actions för att riva direkt."
          sleep $(( WAIT_MINUTES * 60 ))

      - name: Terraform Destroy (Auto)
        if: always()
        uses: ./.github/actions/terraform-destroy
        with:
          working-directory: ${{ env.TERRAFORM_DIR }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  manual-destroy:
    if: inputs.action == 'destroy'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          working-directory: ${{ env.TERRAFORM_DIR }}
          storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}

      - name: Terraform Destroy (Manual)
        uses: ./.github/actions/terraform-destroy
        with:
          working-directory: ${{ env.TERRAFORM_DIR }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
